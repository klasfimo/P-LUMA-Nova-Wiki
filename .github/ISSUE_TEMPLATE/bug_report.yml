name: Bug report
description: Something in P-LUMA is broken, crashes or conflicts with another mod
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [FAQ](https://github.com/klasfimo/P-LUMA-Nova-Wiki/blob/main/FAQ.md) first:
        a few limitations (1.21.9, line width on 1.21.10 and older) are known.
  - type: input
    id: jar
    attributes:
      label: P-LUMA jar
      description: The exact file name in your mods folder
      placeholder: pluma-nova.1.4.5-26.2.jar
    validations:
      required: true
  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "26.2"
        - "26.1.2"
        - "26.1.1"
        - "26.1"
        - "1.21.11"
        - "1.21.10"
        - "1.21.8"
        - "1.21.7"
        - "1.21.6"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mod list
      description: Every mod in your mods folder, or "only P-LUMA and Fabric API"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag `logs/latest.log` (or the crash report from `crash-reports`) into this box
